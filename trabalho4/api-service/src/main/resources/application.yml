server:
  port: ${SERVER_PORT:8080}

spring:
  datasource:
    url: ${SPRING_DATASOURCE_URL:jdbc:postgresql://localhost:5432/bolsa}
    username: ${SPRING_DATASOURCE_USERNAME:bolsa}
    password: ${SPRING_DATASOURCE_PASSWORD:bolsa}
  jpa:
    hibernate:
      ddl-auto: update
    open-in-view: false
    properties:
      hibernate:
        jdbc:
          time_zone: UTC
